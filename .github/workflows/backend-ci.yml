name: Backend CI

# Runs on pull requests only; after a merge, Deploy to Production builds the images.
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: backend/build/reports/jacoco/

  notify-failure:
    name: Notify on failure
    needs: lint-and-test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout notification action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Send ntfy notification
        uses: ./.github/actions/ntfy
        with:
          url: ${{ secrets.NTFY_URL }}
          topic: ${{ secrets.NTFY_TOPIC }}
          token: ${{ secrets.NTFY_TOKEN }}
          title: 'KMA Library: Backend CI nie przeszło'
          message: >-
            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
          tags: x
          priority: '4'
          click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
