name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Commit (and release tag) go into build-info and are shown under the logo
      - name: Build backend artifacts
        working-directory: backend
        env:
          GIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./gradlew build -x test --no-daemon -PgitSha="$GIT_SHA" -PreleaseTag="$RELEASE_TAG"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # VITE_* variables are baked into the bundle; without them .env.production says "dev"
      - name: Build frontend assets
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta-backend.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta-frontend.outputs.created }}
            VERSION=${{ github.ref_name }}

  notify:
    name: Notify
    needs: build-and-push
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout notification action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Send ntfy notification
        uses: ./.github/actions/ntfy
        with:
          url: ${{ secrets.NTFY_URL }}
          topic: ${{ secrets.NTFY_TOPIC }}
          token: ${{ secrets.NTFY_TOKEN }}
          title: >-
            ${{ needs.build-and-push.result == 'success' && 'KMA Library: obrazy gotowe' || 'KMA Library: build nie powiódł się' }}
          message: >-
            ${{ needs.build-and-push.result == 'success' && 'Obrazy w GHCR' || format('Wynik: {0}', needs.build-and-push.result) }}
            – ${{ github.ref_name }} (${{ github.sha }}).
            ${{ needs.build-and-push.result == 'success' && 'Na Pi: docker compose pull, potem up -d.' || '' }}
          tags: >-
            ${{ needs.build-and-push.result == 'success' && 'white_check_mark,package' || 'x,package' }}
          priority: >-
            ${{ needs.build-and-push.result == 'success' && '3' || '4' }}
          click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
