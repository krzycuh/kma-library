# Explicit project name, so this stack doesn't merge with other compose projects kept in the same directory
name: kma-library

services:
  # PostgreSQL Database (no published port: reach it with `docker exec -it kmalibrary-postgres-prod psql -U kmalibrary`)
  postgres:
    image: postgres:16-alpine
    container_name: kmalibrary-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmalibrary}
      POSTGRES_USER: ${POSTGRES_USER:-kmalibrary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kmalibrary}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - kmalibrary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Application (reachable only from the compose network, via the frontend's nginx)
  backend:
    image: ghcr.io/krzycuh/kma-library/backend:${VERSION:-main}
    container_name: kmalibrary-backend-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kmalibrary}
      DATABASE_USERNAME: ${POSTGRES_USER:-kmalibrary}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-true}
      APP_CATALOG_PROVIDER: ${APP_CATALOG_PROVIDER:-openlibrary}
      APP_CATALOG_GOOGLE_API_KEY: ${APP_CATALOG_GOOGLE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PORT: 8080
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    # No published port: the API is served through the frontend container (/api -> backend:8080).
    # Uncomment for local debugging only:
    # ports:
    #   - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kmalibrary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Application: nginx serving the SPA and proxying /api to the backend
  frontend:
    image: ghcr.io/krzycuh/kma-library/frontend:${VERSION:-main}
    container_name: kmalibrary-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8020}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kmalibrary-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kmalibrary-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres
