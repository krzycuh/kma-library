services:
  postgres:
    image: postgres:16-alpine
    container_name: kmalibrary-postgres
    environment:
      POSTGRES_DB: kmalibrary
      POSTGRES_USER: kmalibrary
      POSTGRES_PASSWORD: kmalibrary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmalibrary"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
