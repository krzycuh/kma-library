# Rate limiting: general traffic and a stricter bucket for login/register
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# Keep https from a TLS terminator in front of this container; otherwise use our own scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml application/wasm;

    # Security headers
    # 'wasm-unsafe-eval' lets the ISBN scanner compile its WebAssembly decoder (served from /assets, not a CDN);
    # it does not allow eval() of JavaScript. Permissions-Policy: camera for this origin only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;

    # Health check (used by the container healthcheck and external monitoring)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Auth endpoints: stricter rate limiting
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy-params.conf;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy-params.conf;
        add_header Cache-Control "no-store" always;
    }

    # PWA manifest (nginx may not know the .webmanifest extension)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - send all other requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
